name: Build Orange Client Launcher

on:
  push:
    branches: [experiment/jvm-attach-prototype]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'loader/jvm-attach-prototype/**'
      - '.github/workflows/build-jvm-attach-prototype.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'loader/jvm-attach-prototype/**'
      - '.github/workflows/build-jvm-attach-prototype.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Fabric client payload
        shell: pwsh
        run: |
          .\gradlew.bat remapJar --no-daemon 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $hits = Get-Content build.log | Select-String -Pattern 'error:|What went wrong|Execution failed' -Context 0,2 | ForEach-Object { ($_.Line, $_.Context.PostContext) -join "`n" }
            $msg = ($hits | Select-Object -First 40) -join "`n"
            $msg = $msg.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Host "::error title=build-errors::$msg"
            exit $code
          }
      - name: Inspect client payload
        shell: pwsh
        run: |
          $sb = New-Object System.Text.StringBuilder
          Get-ChildItem build/libs, build/devlibs -Filter *.jar | ForEach-Object {
            $e = @(jar tf $_.FullName)
            $has = [bool]($e | Select-String "^com/example/orangeclient/OrangeClient.class$")
            $rel = $_.FullName.Replace($PWD.Path, '')
            [void]$sb.AppendLine("$rel bytes=$($_.Length) entries=$($e.Count) hasMain=$has")
          }
          $cls = (Get-ChildItem build/classes/java/main -Recurse -Filter *.class -ErrorAction SilentlyContinue | Measure-Object).Count
          [void]$sb.AppendLine("compiled classes in build/classes/java/main: $cls")
          [void]$sb.AppendLine("gradle: $(gradle --version | Select-String 'Gradle ')")
          $msg = $sb.ToString().Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
          Write-Host "::error title=payload-inspect::$msg"
          $inner = "build/libs/orange-client-inner-0.1.0.jar"
          if (!(Test-Path $inner)) { throw "Missing $inner" }
          $entries = @(jar tf $inner)
          if (!($entries | Select-String "^com/example/orangeclient/OrangeClient.class$")) {
            throw "OrangeClient.class missing from $inner ($((Get-Item $inner).Length) bytes)"
          }
      - name: Build installable Fabric mod bundle (mixins load at game startup)
        shell: pwsh
        run: |
          .\gradlew.bat bootstrapJar --no-daemon
          $jar = "build/libs/orange-client-0.1.0.jar"
          if (!(Test-Path $jar)) { throw "Installable Fabric mod bundle was not produced: $jar" }
          $entries = @(jar tf $jar)
          if (!($entries | Select-String "^fabric.mod.json$")) { throw "fabric.mod.json missing from installable bundle" }
          if (!($entries | Select-String "^META-INF/jars/orange-client-0.1.0.jar$")) { throw "Nested client mod missing from installable bundle" }
      - name: Build launcher with bundled client payload
        working-directory: loader/jvm-attach-prototype
        run: gradle clean jar
      - name: Verify launcher and bundled payload
        shell: pwsh
        run: |
          $jar = "loader/jvm-attach-prototype/build/libs/orange-client-launcher-0.1.0.jar"
          if (!(Test-Path $jar)) { throw "Launcher JAR was not produced: $jar" }
          $entries = jar tf $jar
          if (!($entries | Select-String "^com/example/attach/Launcher.class$")) { throw "Launcher class missing" }
          if (!($entries | Select-String "^payload/orange-client-inner-0.1.0.jar$")) { throw "Bundled Orange Client payload missing" }
      - name: Upload installable Fabric mod bundle
        uses: actions/upload-artifact@v4
        with:
          name: Orange-Client-Fabric-Mod
          path: build/libs/orange-client-0.1.0.jar
          if-no-files-found: error
      - name: Upload launcher JAR
        uses: actions/upload-artifact@v4
        with:
          name: Orange-Client-Launcher
          path: loader/jvm-attach-prototype/build/libs/orange-client-launcher-0.1.0.jar
          if-no-files-found: error
