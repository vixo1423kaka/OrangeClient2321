name: Build Windows Loader

on:
  workflow_dispatch:
  push:
    branches: [loader-prototype, launcher-modrinth-style]
    paths:
      - "loader/**"
      - "src/**"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/build-loader.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Orange Client mod jar
        run: .\gradlew.bat build
      - name: Install loader dependencies
        working-directory: loader
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check Python syntax and generate icon
        working-directory: loader
        run: |
          python -m py_compile loader.py make_icon.py
          python make_icon.py
      - name: Build EXE with bundled mod and orange icon
        working-directory: loader
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all customtkinter --icon orange.ico --add-data "orange.ico;." --add-data "../build/libs/orange-client-0.1.0.jar;client-mods" --name OrangeClientLoader loader.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: OrangeClientLoader-Windows
          path: loader/dist/OrangeClientLoader.exe
          if-no-files-found: error
