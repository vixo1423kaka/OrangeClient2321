plugins {
    id 'java'
}

group = 'com.example.orangeclient'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['--add-modules', 'jdk.attach']
}

// This project is built separately from the repository root by CI.
def clientJar = rootProject.file('../../build/libs/orange-client-inner-0.1.0.jar')

tasks.named('jar') {
    archiveBaseName = 'orange-client-launcher'
    manifest {
        attributes(
            'Main-Class': 'com.example.attach.Launcher',
            'Agent-Class': 'com.example.attach.OrangeAgent',
            'Premain-Class': 'com.example.attach.OrangeAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'true'
        )
    }
    doFirst {
        if (!clientJar.isFile()) {
            throw new GradleException("OrangeClient payload missing: ${clientJar}. Run 'gradle remapJar' from the repository root first.")
        }
        def zf = new java.util.zip.ZipFile(clientJar)
        try {
            if (zf.getEntry('com/example/orangeclient/OrangeClient.class') == null || zf.getEntry('fabric.mod.json') == null) {
                throw new GradleException("OrangeClient payload is empty or invalid: ${clientJar} (${clientJar.length()} bytes) " +
                        "has no OrangeClient.class / fabric.mod.json. Rebuild with 'gradle clean remapJar' in the repository root.")
            }
        } finally {
            zf.close()
        }
    }
    from(clientJar) {
        into 'payload'
        rename { 'orange-client-inner-0.1.0.jar' }
    }
}
