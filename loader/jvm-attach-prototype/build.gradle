plugins {
    id 'java'
}

group = 'com.example.orangeclient'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['--add-modules', 'jdk.attach']
}

// Resolve from the repository root, not two directories above it.
def clientJar = rootProject.file('build/libs/orange-client-inner-0.1.0.jar')

tasks.named('jar') {
    dependsOn rootProject.tasks.named('remapJar')
    archiveBaseName = 'orange-client-launcher'
    manifest {
        attributes(
            'Main-Class': 'com.example.attach.Launcher',
            'Agent-Class': 'com.example.attach.OrangeAgent',
            'Premain-Class': 'com.example.attach.OrangeAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'false'
        )
    }
    // Bundle the actual remapped Fabric mod into the launcher JAR.
    doFirst {
        if (!clientJar.isFile()) {
            throw new GradleException("OrangeClient payload missing: ${clientJar}. Build the root remapJar task first.")
        }
    }
    from(clientJar) {
        into 'payload'
        rename { 'orange-client-inner-0.1.0.jar' }
    }
}
