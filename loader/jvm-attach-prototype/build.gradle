plugins {
    id 'java'
}

group = 'com.example.orangeclient'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.compilerArgs += ['--add-modules', 'jdk.attach']
}

def clientJar = rootProject.file('../../build/libs/orange-client-inner-0.1.0.jar')

jar {
    archiveBaseName = 'orange-client-launcher'
    manifest {
        attributes(
            'Main-Class': 'com.example.attach.Launcher',
            'Agent-Class': 'com.example.attach.DiagnosticAgent',
            'Can-Redefine-Classes': 'false',
            'Can-Retransform-Classes': 'false'
        )
    }
    // The real Fabric mod is bundled as a resource for the install step.
    // It is not dynamically loaded by the diagnostic Java agent.
    if (clientJar.exists()) {
        from(clientJar) {
            into 'payload'
            rename { 'orange-client-inner-0.1.0.jar' }
        }
    }
}
