plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}


// A single installable bootstrap bundles the actual client as a nested Fabric mod.
// This avoids asking users to place the Orange Client JAR separately in their mods folder.
tasks.named('remapJar') {
    archiveBaseName.set('orange-client-inner')
}

tasks.register('bootstrapJar', Jar) {
    dependsOn tasks.named('remapJar')
    archiveBaseName.set('orange-client')
    archiveVersion.set(project.version.toString())
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
    from('src/bootstrap/resources') {
        expand(version: project.version.toString())
    }
    from(tasks.named('remapJar')) {
        into 'META-INF/jars'
        rename { "orange-client-${project.version}.jar" }
    }
}

// Keep the existing CI packaging path, but make that artifact the single bootstrap bundle.
tasks.named('build') {
    finalizedBy tasks.named('bootstrapJar')
}
